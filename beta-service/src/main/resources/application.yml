server:
  # 로드밸런싱을 여러 인스턴스로 확인하려면 0 으로 두고 여러 번 실행하면 된다.
  port: 8082
#  port: 0

spring:
  application:
    name: beta-service

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true
